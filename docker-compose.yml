version: '3.8'

services:
  kokoro-tts:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kokoro-tts
    restart: unless-stopped
    expose:
      - "6007"
    environment:
      - OMP_NUM_THREADS=4
      - OPENBLAS_NUM_THREADS=4
    networks:
      - coolify

networks:
  coolify:
    external: true